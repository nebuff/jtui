[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jtui"
version = "1.0.0"
description = "A terminal user interface for Google's Jules asynchronous AI coding agent CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
    { name = "nebuff" }
]
keywords = ["jules", "tui", "google", "cli", "terminal", "ai", "coding-agent"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: Terminals",
]

[project.scripts]
jtui = "jules_tui:main"
jules-tui = "jules_tui:main"

[tool.setuptools]
py-modules = ["jules_tui"]
